name: Build & Deploy

on:
  push:
    branches: [main, claude/zugurt-tesellisi-app-o361as]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run typecheck

  web:
    name: Web & katalog (GitHub Pages)
    runs-on: ubuntu-latest
    needs: typecheck
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Export static web build
        run: npx expo export --platform web
        env:
          GH_PAGES_BASE_PATH: /${{ github.event.repository.name }}

      - run: touch dist/.nojekyll

      - name: Publish to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true

  android:
    name: Android APK
    runs-on: ubuntu-latest
    needs: typecheck
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: gradle/actions/setup-gradle@v4

      - run: npm ci

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install
        env:
          ANDROID_VERSION_CODE: ${{ github.run_number }}

      - name: Build release APK
        working-directory: android
        run: |
          echo "org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g" >> gradle.properties
          ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a
        env:
          NODE_ENV: production

      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk zugurt-tesellisi-${{ github.run_number }}.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-build-${{ github.run_number }}
          name: "Android build #${{ github.run_number }}"
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: zugurt-tesellisi-${{ github.run_number }}.apk
          body: |
            Telefonda bu sayfadan **zugurt-tesellisi-${{ github.run_number }}.apk** dosyasına dokunarak indir ve kur.
            İlk kurulumda Android "bilinmeyen kaynaklardan yükleme" izni isteyebilir.

            Dal: `${{ github.ref_name }}` · Commit: ${{ github.sha }}
